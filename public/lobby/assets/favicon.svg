<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="badge-clip">
      <rect x="4" y="4" width="56" height="56" rx="16" />
    </clipPath>
  </defs>

  <!-- Tactile Offset Ink Shadow -->
  <rect x="6" y="6" width="56" height="56" rx="16" fill="#13271f" />

  <!-- Diagonal Split Background: Left = Engineer Cobalt, Right = Traveler Coral -->
  <g clip-path="url(#badge-clip)">
    <rect x="4" y="4" width="56" height="56" fill="#126fe8" />
    <polygon points="38,4 60,4 60,60 22,60" fill="#f26444" />
    <!-- Diagonal Sketchbook Ink Divider -->
    <line x1="38" y1="2" x2="22" y2="62" stroke="#13271f" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Outer Sketchbook Ink Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#13271f" stroke-width="3.5" />

  <!-- Left World Icon: Code Bracket '<' + Lime Spark -->
  <path
    d="M22 23 L13 32 L22 41"
    fill="none"
    stroke="#fffdf8"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="23" cy="16" r="3" fill="#d9f776" stroke="#13271f" stroke-width="1.8" />

  <!-- Right World Icon: Golden Explorer Compass Star -->
  <g transform="translate(44, 34)">
    <polygon
      points="0,-13 3.8,-3.8 13,0 3.8,3.8 0,13 -3.8,3.8 -13,0 -3.8,-3.8"
      fill="#ffbe3b"
      stroke="#13271f"
      stroke-width="2.2"
      stroke-linejoin="round"
    />
    <circle cx="0" cy="0" r="2.6" fill="#fffdf8" stroke="#13271f" stroke-width="1.6" />
  </g>
</svg>